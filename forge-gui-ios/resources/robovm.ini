# Read by the MobiVM runtime at startup (robovm.ini in the app bundle root).
# Cap the Java heap: without a cap the Boehm GC keeps growing the heap instead of collecting, and iOS kills
# the whole app at its per-process limit (3GB on an iPhone 13 Pro; JetsamEvent "per-process-limit").
# With the cap the GC collects first, Runtime.maxMemory() is known, and the Monte Carlo AI skips its
# simulations when the heap is nearly full. The rest of the 3GB is left to textures and native memory.
mx1400m
