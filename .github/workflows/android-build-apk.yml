name: Build Android APK

# Personal build of Forge with the "Cronache del Velo" campaign.
# Produces a debug-signed APK (package forge.cronache, installs next to the official Forge)
# and the matching assets.zip that the app downloads on first launch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    name: Android build (APK + assets.zip)
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install old maven (3.8.1)
        run: |
          curl -sSL -o apache-maven-3.8.1-bin.tar.gz https://archive.apache.org/dist/maven/maven-3/3.8.1/binaries/apache-maven-3.8.1-bin.tar.gz
          tar xf apache-maven-3.8.1-bin.tar.gz
          echo "$PWD/apache-maven-3.8.1/bin" >> "$GITHUB_PATH"

      - name: Set up Android tools
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --install "build-tools;35.0.0" "platform-tools" "platforms;android-35"

      - name: Install Android maven plugin
        run: |
          mkdir -p ~/.m2/repository/com/simpligility/maven/plugins/android-maven-plugin/4.6.2
          cd ~/.m2/repository/com/simpligility/maven/plugins/android-maven-plugin/4.6.2
          curl -sSL -o android-maven-plugin-4.6.2.jar https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.jar
          curl -sSL -o android-maven-plugin-4.6.2.pom https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.pom

      - name: Build APK (with the shared modules in the same reactor)
        run: |
          mvn --version
          export _JAVA_OPTIONS="-Xmx3g"
          mvn -B -ntp -U -P android-dev-build install -pl forge-gui-android -am -Dapp.id.dev=forge.cronache \
            -Dandroid.sdk.path=$ANDROID_SDK_ROOT -Dandroid.buildToolsVersion=35.0.0 -Dmaven.test.skip=true
          ls -la forge-gui-android/target/*.apk

      - name: Package game resources (assets.zip)
        run: |
          set -e
          STAGE=$RUNNER_TEMP/assets
          rm -rf "$STAGE" && mkdir -p "$STAGE/res"
          rsync -a --exclude 'cardsfolder' --exclude '*.xcf' forge-gui/res/ "$STAGE/res/"
          cp forge-gui-android/target/classes/assets/build.txt "$STAGE/res/build.txt"
          mkdir -p "$STAGE/res/cardsfolder"
          (cd forge-gui/res/cardsfolder && zip -q -1 -r "$STAGE/res/cardsfolder/cardsfolder.zip" .)
          (cd "$STAGE" && zip -q -1 -r "$GITHUB_WORKSPACE/assets.zip" res)
          ls -la assets.zip
          echo "build.txt: $(cat forge-gui-android/target/classes/assets/build.txt)"

      - name: Publish release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls forge-gui-android/target/*.apk | grep -i -E 'signed' | grep -v -i unsigned | head -1)
          [ -n "$APK" ] || APK=$(ls forge-gui-android/target/*.apk | head -1)
          cp "$APK" Forge-Cronache.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Forge-Cronache.apk assets.zip \
            --title "Forge Android - Cronache del Velo" \
            --notes "Installa Forge-Cronache.apk sul telefono Android. Al primo avvio l'app scarica assets.zip da qui. Build del $(date -u +%Y-%m-%d)." \
            --latest=false
